<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">SourceLatch governed knowledge pipeline</title>
  <desc id="desc">Documents cross permission, retrieval, grounding, and citation validation boundaries before producing a supported answer or refusal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312e81" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#4f46e5"/></marker>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="64" y="62" font-size="14" font-weight="700" letter-spacing="2" fill="#4338ca">UNTRUSTED KNOWLEDGE</text>
    <g fill="#fff" stroke="#cbd5e1">
      <rect x="64" y="92" width="210" height="58" rx="10"/><rect x="64" y="166" width="210" height="58" rx="10"/><rect x="64" y="240" width="210" height="58" rx="10"/><rect x="64" y="314" width="210" height="58" rx="10"/>
    </g>
    <g font-size="15" fill="#0f172a"><text x="88" y="128">Policies &amp; manuals</text><text x="88" y="202">Uploaded documents</text><text x="88" y="276">Approved web sources</text><text x="88" y="350">Typed knowledge</text></g>
    <path d="M294 232h92" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)"><rect x="406" y="72" width="394" height="356" rx="24" fill="#111827"/></g>
    <path d="M449 118h36v36h-36zM461 106v60" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
    <text x="502" y="143" font-size="25" font-weight="800" fill="#fff">SOURCE LATCH</text>
    <line x1="449" y1="178" x2="755" y2="178" stroke="#334155"/>
    <g font-size="15" font-weight="700">
      <text x="449" y="218" fill="#a5b4fc">01</text><text x="493" y="218" fill="#e2e8f0">PERMISSION PREDICATE</text>
      <text x="449" y="264" fill="#a5b4fc">02</text><text x="493" y="264" fill="#e2e8f0">HYBRID RETRIEVAL + RRF</text>
      <text x="449" y="310" fill="#a5b4fc">03</text><text x="493" y="310" fill="#e2e8f0">EVIDENCE GROUNDING</text>
      <text x="449" y="356" fill="#a5b4fc">04</text><text x="493" y="356" fill="#e2e8f0">CITATION VALIDATION</text>
    </g>
    <path d="M820 232h78" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="926" y="62" font-size="14" font-weight="700" letter-spacing="2" fill="#4338ca">CONTROLLED OUTPUT</text>
    <rect x="918" y="104" width="218" height="118" rx="16" fill="#ecfdf5" stroke="#6ee7b7"/>
    <circle cx="950" cy="136" r="10" fill="#10b981"/><text x="974" y="142" font-size="16" font-weight="800" fill="#065f46">SUPPORTED</text>
    <text x="950" y="176" font-size="14" fill="#334155">Answer + inspectable</text><text x="950" y="198" font-size="14" fill="#334155">source passages</text>
    <rect x="918" y="250" width="218" height="118" rx="16" fill="#fff7ed" stroke="#fdba74"/>
    <circle cx="950" cy="282" r="10" fill="#f59e0b"/><text x="974" y="288" font-size="16" font-weight="800" fill="#92400e">NOT SUPPORTED</text>
    <text x="950" y="322" font-size="14" fill="#334155">Refusal or human</text><text x="950" y="344" font-size="14" fill="#334155">escalation</text>
    <text x="600" y="469" text-anchor="middle" font-size="13" letter-spacing="1.4" fill="#64748b">EVIDENCE → AUTHORIZATION → SUPPORT → VERIFIED REFERENCE</text>
  </g>
</svg>
